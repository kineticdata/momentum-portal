# This workflow runs on any GitHub tag push (vXX.YY.ZZ) to the repository.
#
# This workflow will:
# - Verify the required variables and secrets are set in this GitHub Repository
# - Install node
# - Install the dependencies for the portal
# - Verify Snyk code scans pass (this is required)
# - Parse MAJOR/MINOR/PATCH/SUFFIX from the tag (e.g. v6.1.8 or v6.1.8-rc2)
# - Publish the built portal into an S3 bucket at one or three destinations
#
# This workflow requires the following variables set in this repository's settings:
# S3_BUCKET                 -> The S3 bucket to publish the portal to
# SOURCE_DIRECTORY          -> The source directory for the portal within this repository
# SNYK_AUTH                 -> A token to authenticate to Snyk for scans
#
# Destinations (under s3://S3_BUCKET/portals/REPOSITORY_NAME/versions/):
# - Real releases (no pre-release/build suffix, e.g. v6.1.8) publish to all three:
#     MAJOR.MINOR.PATCH/   e.g. 6.1.8/
#     MAJOR.MINOR.x/       e.g. 6.1.x/
#     MAJOR.x.x/           e.g. 6.x.x/
# - Pre-release/build tags (e.g. v6.1.8-rc2, v6.1.8+build.5) publish only to
#   the exact-version path; the MAJOR.MINOR.x and MAJOR.x.x lines stay frozen
#   so production spaces never receive an unreleased candidate.
name: Momentum Portal Publish (Tag Push)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish-portal:
    name: Build and Publish Portal to S3
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Determine the Repository Name of where this Action is running
      # GHA does not conveniently set a context variable with *only* the Repository Name
      - name: Set Repository Name
        id: repo_name
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> "$GITHUB_OUTPUT"

      # Verify we were able to parse out the repository name
      - name: Fail if Repository Name Not Set
        if: ${{ !steps.repo_name.outputs.REPO_NAME }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('The REPO_NAME value was not set in the github actions outputs.')
      
      # Verify we have an S3 bucket set in the Repository Variables
      - name: Fail if S3 Bucket Not Set
        if: ${{ !vars.S3_BUCKET }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('The S3_BUCKET variable was not set in the Repository Settings.')

      # Verify we have a build location set
      # This is variablized, as the portal build location could be different per repository
      - name: Fail if Source Directory Not Set
        if: ${{ !vars.SOURCE_DIRECTORY }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('The SOURCE_DIRECTORY variable was not set in the Repository Settings.')

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.ACCOUNT_ID }}:role/${{ steps.repo_name.outputs.REPO_NAME }}-github-oidc
          aws-region: us-east-1

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install dependencies
      - name: Run Yarn Install
        working-directory: ${{ vars.SOURCE_DIRECTORY }}
        run: yarn install

      # Build the portal
      - name: Run Yarn Build
        working-directory: ${{ vars.SOURCE_DIRECTORY }}
        run: yarn build

      # Verify Snyk Scans Pass
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_AUTH }}
        with:
          args: ${{ vars.SOURCE_DIRECTORY }}/ --severity-threshold=critical

      # Parse MAJOR/MINOR/PATCH and any pre-release/build SUFFIX from the tag.
      # Real releases (no suffix) fan out to three destinations; pre-release
      # tags publish only to the exact-version destination.
      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PARTS=$(echo "$TAG" | sed -nE 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+)(.*)/\1 \2 \3 \4/p')
          if [ -z "$PARTS" ]; then
            echo "Could not parse semver from tag '$TAG'" >&2
            exit 1
          fi
          read -r MAJOR MINOR PATCH SUFFIX <<< "$PARTS"
          echo "MAJOR=$MAJOR"   >> "$GITHUB_OUTPUT"
          echo "MINOR=$MINOR"   >> "$GITHUB_OUTPUT"
          echo "PATCH=$PATCH"   >> "$GITHUB_OUTPUT"
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_OUTPUT"

      # Copy our built portal to the S3 bucket.
      # Always publish to the exact-version path. For real releases (no
      # pre-release/build suffix) also fan out to the MAJOR.MINOR.x and
      # MAJOR.x.x lines so consumers can pin to whichever granularity they
      # want.
      - name: Deploy to S3
        working-directory: ${{ vars.SOURCE_DIRECTORY }}
        env:
          BASE: s3://${{ vars.S3_BUCKET }}/portals/${{ steps.repo_name.outputs.REPO_NAME }}/versions
          MAJOR: ${{ steps.version.outputs.MAJOR }}
          MINOR: ${{ steps.version.outputs.MINOR }}
          PATCH: ${{ steps.version.outputs.PATCH }}
          SUFFIX: ${{ steps.version.outputs.SUFFIX }}
          SYNC_OPTS: --cache-control=must-revalidate,max-age:0 --delete
        run: |
          aws s3 sync ./build "$BASE/$MAJOR.$MINOR.$PATCH$SUFFIX/" $SYNC_OPTS
          if [ -z "$SUFFIX" ]; then
            aws s3 sync ./build "$BASE/$MAJOR.$MINOR.x/" $SYNC_OPTS
            aws s3 sync ./build "$BASE/$MAJOR.x.x/" $SYNC_OPTS
          fi